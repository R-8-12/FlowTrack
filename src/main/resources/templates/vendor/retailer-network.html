<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Network - FlowTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .sidebar { width:260px; min-height:100vh; background:linear-gradient(180deg,#1a365d 0%,#2a4a7f 100%); position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index:100; }
        .sidebar-brand { padding:1.5rem; border-bottom:1px solid rgba(255,255,255,0.1); color:white; }
        .sidebar-brand h4 { font-weight:700; margin:0; font-size:1.2rem; }
        .sidebar a { display:flex; align-items:center; padding:0.7rem 1.5rem; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.9rem; transition:all 0.2s; gap:0.75rem; }
        .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,0.1); color:white; }
        .sidebar a i { width:20px; text-align:center; }
        .nav-item-label { padding:0.35rem 1.5rem; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.4); margin-top:0.75rem; }
        .sidebar-footer { padding:1rem 1.5rem; border-top:1px solid rgba(255,255,255,0.1); }
        .main-content { margin-left:260px; min-height:100vh; }
        .topbar { background:white; border-bottom:1px solid #e2e8f0; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
        .page-body { padding:2rem; }
        .connection-card { background:white; border-radius:12px; padding:1.25rem; border:1px solid #e2e8f0; transition:all 0.2s; }
        .connection-card:hover { border-color:#2b6cb0; box-shadow:0 4px 12px rgba(43,108,176,0.1); }
        .badge-connected { background:#f0fff4; color:#38a169; border:1px solid #c6f6d5; }
        .badge-requested { background:#fffaf0; color:#dd6b20; border:1px solid #feebc8; }
        .badge-rejected { background:#fff5f5; color:#e53e3e; border:1px solid #fed7d7; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand"><h4><i class="fas fa-warehouse me-2"></i>FlowTrack</h4><small>Vendor Portal</small></div>
    <nav style="padding:1rem 0; flex:1;">
        <div class="nav-item-label">Main</div>
        <a href="/vendor/dashboard"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/business-profile/status"><i class="fas fa-building"></i> Business Profile</a>
        <div class="nav-item-label">Catalog</div>
        <a href="/products"><i class="fas fa-box-open"></i> Product Catalog</a>
        <a href="/orders"><i class="fas fa-shopping-cart"></i> Orders</a>
        <div class="nav-item-label">Network</div>
        <a href="/vendor/retailers" class="active"><i class="fas fa-store"></i> Retailer Network</a>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:0.85rem;cursor:pointer;padding:0;display:flex;align-items:center;gap:0.5rem;">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 style="margin:0; font-weight:600; color:#2d3748;">Retailer Network</h5>
            <small class="text-muted">Manage connection requests and connected retailers</small>
        </div>
        <span class="badge" style="background:#ebf8ff; color:#2b6cb0; border:1px solid #bee3f8;">VENDOR</span>
    </div>

    <div class="page-body">
        <!-- Pending Requests -->
        <div class="mb-4">
            <h6 class="fw-600 text-muted text-uppercase mb-3" style="font-size:0.75rem; letter-spacing:0.08em;">
                <i class="fas fa-clock me-1 text-warning"></i> Pending Requests
            </h6>
            <div id="pendingList">
                <div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</div>
            </div>
        </div>

        <!-- Connected Retailers -->
        <div>
            <h6 class="fw-600 text-muted text-uppercase mb-3" style="font-size:0.75rem; letter-spacing:0.08em;">
                <i class="fas fa-check-circle me-1 text-success"></i> Connected Retailers
            </h6>
            <div id="connectedList">
                <div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Loading...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const csrfToken  = document.querySelector('meta[name="_csrf"]')?.content;
const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

function authHeaders() {
    const h = { 'Content-Type': 'application/json' };
    if (csrfToken && csrfHeader) h[csrfHeader] = csrfToken;
    return h;
}

async function loadPending() {
    const res = await fetch('/api/vendor/connections/pending');
    const data = await res.json();
    const el = document.getElementById('pendingList');
    if (!data.length) { el.innerHTML = '<p class="text-muted">No pending requests.</p>'; return; }
    el.innerHTML = data.map(c => `
        <div class="connection-card mb-2 d-flex align-items-center justify-content-between">
            <div>
                <strong>${c.retailerName}</strong>
                <div class="text-muted" style="font-size:0.82rem;">${c.retailerMessage || 'No message'}</div>
                <small class="text-muted">${new Date(c.createdAt).toLocaleDateString()}</small>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-success" onclick="respond(${c.connectionId}, true)">
                    <i class="fas fa-check"></i> Approve
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="respond(${c.connectionId}, false)">
                    <i class="fas fa-times"></i> Reject
                </button>
            </div>
        </div>`).join('');
}

async function loadConnected() {
    const res = await fetch('/api/vendor/connections/connected');
    const data = await res.json();
    const el = document.getElementById('connectedList');
    if (!data.length) { el.innerHTML = '<p class="text-muted">No connected retailers yet.</p>'; return; }
    el.innerHTML = data.map(c => `
        <div class="connection-card mb-2 d-flex align-items-center justify-content-between">
            <div>
                <strong>${c.retailerName}</strong>
                <span class="badge badge-connected ms-2">Connected</span>
                <div class="text-muted" style="font-size:0.82rem;">Since ${new Date(c.updatedAt).toLocaleDateString()}</div>
            </div>
            <button class="btn btn-sm btn-outline-secondary" onclick="blockConn(${c.connectionId})">
                <i class="fas fa-ban"></i> Block
            </button>
        </div>`).join('');
}

async function respond(id, approve) {
    await fetch('/api/vendor/connections/respond', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ connectionId: id, approve })
    });
    loadPending(); loadConnected();
}

async function blockConn(id) {
    if (!confirm('Block this retailer connection?')) return;
    await fetch(`/api/vendor/connections/${id}/block`, { method: 'POST', headers: authHeaders() });
    loadConnected();
}

loadPending(); loadConnected();
</script>
</body>
</html>
