<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - FlowTrack'">Product Catalog - FlowTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .placeholder-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .placeholder-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .placeholder-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ebf8ff 0%, #e3f2fd 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: #2b6cb0;
        }
        h1 { font-size: 1.75rem; font-weight: 700; color: #2d3748; margin-bottom: 1rem; }
        .message { color: #718096; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
        .btn-primary { background: #2b6cb0; border-color: #2b6cb0; padding: 0.75rem 1.5rem; }
        .btn-primary:hover { background: #2c5282; border-color: #2c5282; }
    </style>
</head>
<body>
    <div class="placeholder-container">
        <div class="placeholder-card">
            <div class="placeholder-icon">
                <i class="fas fa-box-open"></i>
            </div>
            <h1 th:text="${pageTitle}">Product Catalog</h1>
            <p class="message" th:text="${message}">
                Product catalog management coming soon. You'll be able to list, edit, and manage your product inventory here.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="/vendor/dashboard" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
