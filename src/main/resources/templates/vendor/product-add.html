<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - FlowTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .sidebar { width:260px; min-height:100vh; background:linear-gradient(180deg,#1a365d 0%,#2a4a7f 100%); position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index:100; }
        .sidebar-brand { padding:1.5rem; border-bottom:1px solid rgba(255,255,255,0.1); color:white; }
        .sidebar-brand h4 { font-weight:700; margin:0; font-size:1.2rem; }
        .nav-item-label { padding:0.35rem 1.5rem; font-size:0.7rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.4); margin-top:0.75rem; }
        .sidebar a { display:flex; align-items:center; padding:0.7rem 1.5rem; color:rgba(255,255,255,0.75); text-decoration:none; font-size:0.9rem; transition:all 0.2s; gap:0.75rem; }
        .sidebar a:hover, .sidebar a.active { background:rgba(255,255,255,0.1); color:white; }
        .sidebar a i { width:20px; text-align:center; }
        .sidebar-footer { padding:1rem 1.5rem; border-top:1px solid rgba(255,255,255,0.1); }
        .main-content { margin-left:260px; min-height:100vh; }
        .topbar { background:white; border-bottom:1px solid #e2e8f0; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
        .page-body { padding:2rem; }
        .form-card { background:white; border-radius:14px; border:1px solid #e2e8f0; padding:2rem; max-width:720px; }
        .form-label { font-weight:500; font-size:0.88rem; color:#374151; }
        .section-title { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#9ca3af; margin:1.5rem 0 0.75rem; }
        .required-star { color:#e53e3e; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        <h4><i class="fas fa-warehouse me-2"></i>FlowTrack</h4>
        <small style="opacity:0.6; font-size:0.75rem;">Vendor Portal</small>
    </div>
    <nav style="padding:1rem 0; flex:1;">
        <div class="nav-item-label">Main</div>
        <a href="/vendor/dashboard"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/business-profile/status"><i class="fas fa-building"></i> Business Profile</a>
        <div class="nav-item-label">Catalog</div>
        <a href="/products" class="active"><i class="fas fa-box-open"></i> Product Catalog</a>
        <a href="/orders"><i class="fas fa-shopping-cart"></i> Orders</a>
        <div class="nav-item-label">Network</div>
        <a href="/vendor/retailers"><i class="fas fa-store"></i> Retailer Network</a>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:0.85rem;cursor:pointer;padding:0;display:flex;align-items:center;gap:0.5rem;">
                <i class="fas fa-sign-out-alt"></i> Sign Out
            </button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h5 style="margin:0; font-weight:600; color:#2d3748;">Add New Product</h5>
            <small class="text-muted">List a product for retailers to discover and order</small>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="badge" style="background:#ebf8ff; color:#2b6cb0; border:1px solid #bee3f8;">VENDOR</span>
            <a href="/products" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i> Back to Catalog
            </a>
        </div>
    </div>

    <div class="page-body">
        <div th:if="${successMessage}" class="alert alert-success mb-3" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mb-3" th:text="${errorMessage}"></div>

        <div class="form-card">
            <form th:action="@{/products/add}" method="post" th:object="${product}" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Basic Info -->
                <div class="section-title">Product Details</div>
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Product Name <span class="required-star">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}"
                               placeholder="e.g. Premium Cotton Fabric"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Category <span class="required-star">*</span></label>
                        <select class="form-select" th:field="*{category}"
                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                            <option value="">Select category</option>
                            <option value="Raw Materials">Raw Materials</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Textiles">Textiles</option>
                            <option value="Food & Beverage">Food &amp; Beverage</option>
                            <option value="Chemicals">Chemicals</option>
                            <option value="Packaging">Packaging</option>
                            <option value="Hardware">Hardware</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"
                                  placeholder="Describe the product — specifications, quality grade, packaging details..."></textarea>
                    </div>
                </div>

                <!-- Pricing & Stock -->
                <div class="section-title">Pricing &amp; Availability</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Unit Price (₹) <span class="required-star">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" class="form-control" th:field="*{pricePerUnit}"
                                   min="0" step="0.01" placeholder="0.00"
                                   th:classappend="${#fields.hasErrors('pricePerUnit')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('pricePerUnit')}" th:errors="*{pricePerUnit}"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Available Stock (units) <span class="required-star">*</span></label>
                        <input type="number" class="form-control" th:field="*{availableQuantity}"
                               min="0" placeholder="0"
                               th:classappend="${#fields.hasErrors('availableQuantity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('availableQuantity')}" th:errors="*{availableQuantity}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Minimum Order Qty</label>
                        <input type="number" class="form-control" th:field="*{minimumOrderQuantity}"
                               min="1" placeholder="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Delivery Days <span class="required-star">*</span></label>
                        <input type="number" class="form-control" th:field="*{deliveryDays}"
                               min="1" placeholder="e.g. 3"
                               th:classappend="${#fields.hasErrors('deliveryDays')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('deliveryDays')}" th:errors="*{deliveryDays}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Unit of Measure</label>
                        <select class="form-select" th:field="*{unit}">
                            <option value="pieces">Pieces</option>
                            <option value="kg">Kilograms (kg)</option>
                            <option value="g">Grams (g)</option>
                            <option value="litres">Litres</option>
                            <option value="metres">Metres</option>
                            <option value="boxes">Boxes</option>
                            <option value="rolls">Rolls</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">SKU / Product Code</label>
                        <input type="text" class="form-control" th:field="*{sku}" placeholder="e.g. COT-PRE-001">
                    </div>
                </div>

                <!-- Actions -->
                <hr class="my-4">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus-circle me-1"></i> List Product
                    </button>
                    <a href="/products" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
