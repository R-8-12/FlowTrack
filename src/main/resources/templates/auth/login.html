<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="card">
                <div class="card-header text-center">
                    <h3><i class="fas fa-warehouse"></i> FlowTrack</h3>
                    <p class="mb-0">Login to your account</p>
                </div>
                <div class="card-body p-4">
                    <!-- Flash message from registration redirect -->
                    <div th:if="${successMessage}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${successMessage}">Registration successful!</span>
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i> Registration successful! Please login.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info">
                        <i class="fas fa-sign-out-alt"></i> You have been logged out successfully.
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i> Invalid username or password.
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label for="username"><i class="fas fa-user"></i> Username</label>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="Enter username" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="password"><i class="fas fa-lock"></i> Password</label>
                            <input type="password" class="form-control" id="password" name="password" 
                                   placeholder="Enter password" required>
                        </div>
                        <div class="form-group mb-3">
                            <small class="text-muted">
                                <i class="fas fa-clock"></i> You will stay signed in unless you log out.
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>

                    <!-- Google Sign-In -->
                    <div class="google-signin-section text-center my-3">
                        <p class="google-signin-divider text-muted mb-2">
                            <span class="google-signin-divider-label">Or continue with</span>
                            <hr class="google-signin-divider-line">
                        </p>
                        <a th:href="@{/oauth2/authorization/google}"
                           class="btn btn-outline-secondary btn-block google-signin-button">
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                                 alt="Google" width="18" height="18">
                            Continue with Google
                        </a>
                    </div>

                    <hr>
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a th:href="@{/get-started}">Create account</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
